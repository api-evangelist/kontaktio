aid: kontaktio
name: Kontakt.io
description: 'Kontakt.io is an AI-powered real-time location system (RTLS) and IoT
  platform for healthcare operations, founded in 2013 with offices in New York and
  Krakow. Its Kio Cloud platform combines BLE/UWB tags, badges, gateways and sensors
  with software for asset tracking, staff safety, patient flow, room and seat occupancy,
  and environmental telemetry. Developers integrate through the Kontakt.io Developer
  Center, which publishes four OpenAPI contracts: a Device Management API for provisioning,
  configuring and firmware-upgrading devices, a Location & Occupancy API for real-time
  and historical positions, presences, occupancy and telemetry plus a Streams API for
  event subscriptions, a Spaces API, and an Entity Management Integration API for
  batch import of staff and asset entities. Kio Cloud runs in US and UK regions and
  ships iOS and Android SDKs.'
