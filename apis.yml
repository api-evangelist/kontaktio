- aid: kontaktio:kontaktio-device-3rd-party-api
  name: Kontakt.io Device (3rd party) API
  description: >-
    NOTE: this set of endpoints has been superseded by External Devices functionality.


    These endpoints provide a way to integrate 3rd party Bluetooth-enabled scanning devices into Kontakt.io
    platform. As of Summer 2018, Kontakt.io is working with manufacturers of enterprise-level networking
    devices, like Cassia, Ruckus and Meraki, to seamlessly incorporate data collected by their routers
    and/or WiFi access points into Kontakt.io Data Streams, and to improve Infrastructure Management capabilities.


    Users wanting to take advantage of this feature, first need to provide proper authentication and integrate
    Kontakt.io Panel account with a 3rd party vendor. Only after that, devices from that vendor can be
    added into Kontakt.io platform.


    At any given moment a Company can have **only one** integration per 3rd party Vendor, i.e. you can
    have **one** Cassia *and* **one** Meraki integration, but you can't have e.g. two Meraki integrations.
  humanURL: >-
    https://developer.kontakt.io/docs/dev-ctr-device-api/a09dcbf0d03de-device-management-api-introduction
