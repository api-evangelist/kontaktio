- name: Kontakt.io Device Management API
  description: REST API for managing Kontakt.io devices in Kio Cloud — devices, configs,
    firmware, firmware upgrade schedules, commands, orders, managers, namespaces,
    proximity UUIDs, venues, device sharing and third-party (Meraki) device integrations.
    Versioned through the Accept header (application/vnd.com.kontakt+json;version=10).
  humanURL: https://developer.kontakt.io/docs/dev-ctr-device-api/a09dcbf0d03de-device-management-api-introduction
