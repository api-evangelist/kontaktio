primary:
  model: oauth2-client-credentials -> JWT bearer
  idp: Keycloak (per-tenant realm)
  token_endpoint: https://kc.cloud.{region}.kontakt.io/realms/{tenant}/protocol/openid-connect/token
  grant_type: client_credentials
  scope: profile email openid
  token_type: Bearer
  token_lifetime_seconds: 300
  regions:
  - us
  - uk
  tenant_note: '{tenant} is the account Tenant Name from the account URL https://{tenant}.app.cloud.{region}.kontakt.io'
  authorization: Carried by the Keycloak client role integration-api, not by OAuth scopes. See scopes/kontaktio-scopes.yml.
  client_provisioning: Integration API Clients are created in Kio Cloud under Users > Integration API by a
    user holding the User Management integration-api role; Client ID is prefixed api-{companyId}-.
  error_on_expiry: 401 Unauthorized. Refresh once and retry once; do not loop.
  docs: https://developer.kontakt.io/docs/entity-management-integration-api/0255c5646ab01-authentication-o-auth2-client-credentials-flow
legacy:
  model: api-key
  header: Api-Key
  status: deprecated
  removal: Announced for removal in a future release; no date published.
  provenance: Kio Cloud > Users > Security > Server API Key (one per account user).
  note: The deprecation is NOT uniformly applied. Only the Device Management spec marks api_key deprecated
    and offers bearer_token alongside it. The Location & Occupancy and Spaces specs declare Api-Key as their
    ONLY scheme, so a client written against the current published contracts still has to use the deprecated
    mechanism for two of the four APIs.
