- status: 401
  title: Unauthorized
  description: Authentication credentials are missing or invalid. Either the JWT Bearer
    token or the legacy Api-Key is not present, expired, or disabled.
  remediation: Request a fresh access token from the Keycloak token endpoint and retry
    once. JWT lifetime is 300 seconds.
  declared_in:
  - openapi/kontaktio-device-management-openapi.yml
  - openapi/kontaktio-entity-management-openapi.yml
  occurrences: 20
- status: 403
  title: Forbidden
  description: A user or device-model error. User error — the manager who created
    the API credential no longer has access to the Kio Cloud account, or their role
    does not allow the endpoint. Device error — the endpoint is not available for
    that device model.
  declared_in:
