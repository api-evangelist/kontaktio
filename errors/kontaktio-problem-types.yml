format: custom-json
rfc9457: false
envelope:
  media_type: application/json
  shape: |-
    {
      "message": "<object name that failed validation>",
      "errors": [
        { "field": "<field name>", "error": "<error type>", "invalidValue": "<value that failed>" }
      ]
    }
  fields:
  - name: message
    type: string
    description: Object name that failed validation.
  - name: errors[]
    type: array
    description: Array of field errors.
  - name: errors[].field
    type: string
    description: Field name.
  - name: errors[].error
    type: string
    description: Error type.
  - name: errors[].invalidValue
    type: string
    description: The invalid value that did not pass validation.
  note: 'Kontakt.io does NOT use RFC 9457 / RFC 7807 problem+json. No operation in
    any of the four specs declares an application/problem+json response. The Device
    Management API additionally returns an opaque incident envelope on 401 —
    {"id":"API_ERROR_<epoch-ms>","status":401,"cause":"..."} — observed live on
    dm-api.cloud.us.kontakt.io during probing.'
problems:
- status: 200
  title: OK
  description: Everything worked as expected.
  kind: success
- status: 201
  title: Created
  description: Entity successfully created.
  kind: success
- status: 303
  title: Redirected
  description: Request valid, but needed to be redirected elsewhere.
  kind: redirect
- status: 400
  title: Bad Request
  description: Several different error titles are returned for 400 errors; the response
    body carries message + errors[] describing which fields failed validation.
  remediation: Read errors[] and correct the named fields before retrying.
  declared_in:
