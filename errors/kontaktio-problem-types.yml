  - openapi/kontaktio-entity-management-openapi.yml
  occurrences: 2
- status: 415
  title: Not found (version or media type)
  description: Version or mediatype not found — raised when the Accept header requests
    an unknown API version, e.g. application/vnd.com.kontakt+json;version=99.
  remediation: Send a supported Accept version (current stable is version=10) or omit
    the version parameter.
- status: 422
