    FirmwareInfo:
      type: object
      description: Details about device's firmware.
      required:
        - firmwareName
        - firmwareVersion
        - upgrade
      properties:
        firmwareName:
          type: string
          description: Identifier of the firmware.
          example: portal-beam
        firmwareVersion:
          type: string
          description: Version of the firmware.
          example: 2.8.1
        upgrade:
          type: object
          description: Details about next firmware upgrade.
          properties:
            nextAvailableVersion:
              type: string
              description: 'Latest firmware version device can be upgraded to, if any.'
              nullable: true
              example: 2.10.1
            scheduledVersion:
              type: string
              description: Firmware version that was scheduled for upgrade.
              nullable: true
              example: 2.10.0
            onDemand:
              type: boolean
              description: Whether firmware upgrade should be scheduled immediately.
            releaseChannel:
              type: string
              description: Name of the release channel that is used to find firmware upgrades
              example: regular
            scheduledBy:
              type: object
              description: User who scheduled firmware upgrade.
              nullable: true
              required:
                - id
                - email
                - fullName
              properties:
                id:
                  type: string
                  format: uuid
                  description: User id.
                email:
                  type: string
                  format: email
                  description: User email.
                fullName:
                  type: string
                  description: Full user name.
            lastError:
              type: object
              description: Last recorded firmware upgrade error.
              nullable: true
              properties:
                message:
                  type: string
                  description: Error message.
                timestamp:
                  type: string
                  format: date-time
                  description: Error timestamp.
                  example: '2023‐09‐18T15:33:00Z'
