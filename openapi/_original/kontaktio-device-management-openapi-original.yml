        metadata:
          type: object
          nullable: true
          description: Object containing arbitrary key-value pairs that can be defined by a Device's Manager
        properties:
          type: object
          nullable: true
          description: Object containing arbitrary key-value pairs that can be defined by a Device's Manager
        lat:
