          - 'null'
          description: MAC address used for Eddystone advertising.
          example: AA:BB:CC:DD:EE:03
        ibeaconMac:
          type:
          - string
          - 'null'
          description: MAC address used for iBeacon advertising.
          example: AA:BB:CC:DD:EE:04
    OccupancyAllSettings:
      description: Occupancy settings. Only applicable to devices with occupancy capability.
      allOf:
      - $ref: '#/components/schemas/OccupancyPhysicalSettings'
      - type: object
        properties:
          inclusions:
            $ref: '#/components/schemas/OccupancyInclusionZones'
          exclusions:
            $ref: '#/components/schemas/OccupancyExclusionZones'
          stitching:
            type: object
            description: Stitching configuration (no images in device responses).
            properties:
              intersections:
                type: array
                items:
                  $ref: '#/components/schemas/StitchingPairMinimal'
    DeviceCategory:
      type: string
      enum:
      - TAG
      - INFRASTRUCTURE
      description: Category of the device, whether it's a moving (TAG) or static (INFRASTRUCTURE) device.
    StitchingPivotWorld:
      description: 'Pivot (rotation point) of the image in the world coordinates that are shared between stitched devices.

        Origin is top left corner.'
      type: object
      required:
      - x
      - y
      properties:
        x:
          description: X coordinate in world coordinates.
          type: integer
          example: 420
        y:
          description: Y coordinate in world coordinates.
          type: integer
          example: 160
    FirmwareInfo:
      type: object
      description: Details about device's firmware.
      required:
      - firmwareName
      - firmwareVersion
      - upgrade
      properties:
        firmwareName:
          type: string
          description: Identifier of the firmware.
          example: portal-beam
        firmwareVersion:
          type: string
          description: Version of the firmware.
          example: 2.8.1
        upgrade:
          type: object
          description: Details about next firmware upgrade.
          properties:
            nextAvailableVersion:
              type:
              - string
              - 'null'
              description: Latest firmware version device can be upgraded to, if any.
              example: 2.10.1
            scheduledVersion:
              type:
              - string
              - 'null'
              description: Firmware version that was scheduled for upgrade.
              example: 2.10.0
            onDemand:
              type: boolean
              description: Whether firmware upgrade should be scheduled immediately.
            releaseChannel:
              type: string
              description: Name of the release channel that is used to find firmware upgrades
              example: regular
            scheduledBy:
              type:
              - object
              - 'null'
              description: User who scheduled firmware upgrade.
              required:
              - id
              - email
              - fullName
              properties:
                id:
                  type: string
                  format: uuid
                  description: User id.
                email:
                  type: string
                  format: email
                  description: User email.
                fullName:
                  type: string
                  description: Full user name.
            lastError:
              type:
              - object
              - 'null'
              description: Last recorded firmware upgrade error.
              properties:
                message:
                  type: string
                  description: Error message.
                timestamp:
                  type: string
                  format: date-time
                  description: Error timestamp.
                  example: 2023‐09‐18T15:33:00Z
    StitchingPairMinimal:
      type: object
      required:
      - otherDeviceUniqueId
      - pose
      properties:
        otherDeviceUniqueId:
          type: string
          description: Unique ID of the other device in the stitched pair.
        pose:
          $ref: '#/components/schemas/StitchingPose'
    SensorSettings:
      type: object
      description: Device sensor settings.
      properties:
        samplingInterval:
          type: integer
          description: Interval (in seconds) at which sensor data is sampled.
          example: 60
          minimum: 1
          maximum: 3600
        loggingFactor:
          type: integer
          description: Factor used to determine how often sensor data is logged.
          example: 15
          minimum: 1
          maximum: 65535
    SearchMeta:
      type: object
      title: Search Metadata
      description: Additional information, pagination and metadata about an API response
      externalDocs:
        description: Pagination model description
        url: /backend/management/pagination/
      properties:
        filter:
          type: string
          description: Filter query used in the API call
        startIndex:
          type: integer
          description: Start index for the results array
        maxResult:
          type: integer
          description: Maximum numbers of results in a single response
        prevResults:
          type: string
          description: URL for the previous page of results
          format: URL
        count:
          type:
          - integer
          - 'null'
          description: Number of results. Not `null` only when the `queryType` is set to `COUNTED` or `SEARCH_META`.
        orderBy:
          type: string
          enum:
          - CREATED
        nextResults:
          type: string
          format: URL
          description: URL for the next page of results
        queryType:
          description: Query type. `COUNTED` - returns a number of results in the `count` field. `SEARCH_META` - returns only the `searchMeta` object, but with a number of results in the `count` field.
          type: string
          enum:
          - NORMAL
          - COUNTED
          - SEARCH_META
          default: NORMAL
        order:
          type: string
          description: Sorting order - `ASC`ending (default) or `DESC`ending
          enum:
          - ASC
          - DESC
          default: ASC
    CreatedDate:
      description: Informs when the object has been created.
      type: string
      format: date-time
      example: 2023‐09‐18T15:33:00Z
  parameters:
    QueryStartIndex:
      in: query
      name: startIndex
      required: false
      description: Starting row index for pagination. Start index should be equal to `pageNumber * maxResult`.
      schema:
        type: integer
        default: 0
        minimum: 0
    accept:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        default: application/vnd.com.kontakt+json;version=10
      description: Accept header is required.
    QueryType:
      in: query
      name: queryType
      required: false
      description: '`COUNTED` returns a number of all items (not just on the current page) in the `searchMeta` object.

        '
      schema:
        type: string
        enum:
        - NORMAL
        - COUNTED
        - SEARCH_META
        default: NORMAL
    BulkDeviceAccessJobKeyPathParam:
      name: jobKey
      in: path
      required: true
      description: Name of the job
      schema:
        type: string
        example: grant-device-access_b4dfa2ed-4ac9-4b36-b662-be6be3925193
    UniqueIdList:
      name: uniqueId
      in: query
      description: List of devices' unique ids
      required: true
      schema:
        type: array
        items:
          type: string
        example:
        - 11P10AvW
        - 11S13AhY
    QueryDeviceType:
      name: deviceType
      in: query
      description: Limits the response only to devices with a given type
      required: false
      schema:
        $ref: '#/components/schemas/DeviceType'
    QueryMaxResult:
      in: query
      name: maxResult
      required: false
      description: Maximum number of results
      schema:
        type: integer
        default: 50
        minimum: 0
        maximum: 500
    QueryDeviceSelector:
      in: query
      name: selector
      required: false
      style: form
      description: "Limit returned response to the specified fields. Comma separated. Handy in reducing payload sizes.\n\n`uniqueId` and `queriedBy` fields will always be included in the response.\n<br/>\n<br/>\n**Applicable fields:**\n- accelerometer  \n- access  \n- alias  \n- batteryLevel  \n- bleScanSettings  \n- category  \n- currentLocation  \n- deployedLat  \n- deployedLng  \n- deployment.status  \n- deviceType  \n- displaySettings  \n- firmware  \n- futureId  \n- id  \n- instanceId  \n- interval  \n- irReceiverSettings  \n- irTransmitterSettings  \n- lastErrorTimestamp  \n- lastSeen  \n- lat  \n- lng  \n- localAlertingSettings  \n- lowBatterySettings  \n- mac  \n- major  \n- managerId  \n- metadata  \n- minor  \n- model  \n- name  \n- namespace  \n- occupancySettings  \n- orderId  \n- ownerId  \n- packets  \n- pendingConfig  \n- powerSaving  \n- product  \n- productCode  \n- profiles  \n- proximity  \n- role  \n- rssi0m  \n- rssi1m  \n- scheduledVersion  \n- secureNamespace  \n- secureProximity  \n- sensorSettings  \n- shares  \n- shuffled  \n- status  \n- tags  \n- telemetryFields  \n- txPower  \n- url\n- vendor"
      schema:
        type: string
        example: uniqueId,product,deployment.status
    QueryDeviceOrderBy:
      in: query
      name: orderBy
      required: false
      description: "Order results by selected field. In case the resulting order is non-unique, entries with duplicate values are sorted by device id.\n<br/>\n<br/>\n**Applicable fields:**\n- alias  \n- batteryLevel  \n- created  \n- deployment.status  \n- deviceType  \n- id  \n- instanceId  \n- interval  \n- lastErrorTimestamp  \n- lastSeen  \n- major  \n- manager.lastName  \n- minor  \n- model  \n- name  \n- namespace  \n- orderId  \n- pendingConfig  \n- product  \n- profiles  \n- proximity  \n- role  \n- scheduledVersion  \n- txPower  \n- uniqueId  \n- updated  \n- vendor"
      schema:
        type: string
  securitySchemes:
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Provide a JWT in the `Authorization: Bearer <token>` header. This is the standard authentication method for all API requests.


        Obtain a token via the OAuth2 Client Credentials flow from the Kontakt.io Keycloak identity provider.'
    api_key:
      type: apiKey
      name: Api-Key
      in: header
      description: '**Deprecated — do not use for new integrations.** This method exists solely for backward compatibility and will be removed in a future release. Use JWT Bearer token authentication instead.


        If you still need an API Key: sign in to **Kio Cloud** > select **Users** > select **Security** > copy your **Server API Key**.'
    management_api_key:
      name: Api-Key
      type: apiKey
      in: header
      description: Special management API Key with additional privileges used by authorized users.
externalDocs:
  url: https://developer.kontakt.io
