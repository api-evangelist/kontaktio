    Device:
      type: object
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: UUID
            description: Device object ID used internally in Kontakt.io API.
          uniqueId:
            type: string
            description: Unique ID of the device.
          deviceType:
            $ref: '#/components/schemas/DeviceType'
          category:
            $ref: '#/components/schemas/DeviceCategory'
          model:
