        major:
          type:
          - integer
          - 'null'
          format: uint16
          minimum: 0
          maximum: 65535
          description: iBeacon Major.
        minor:
          type:
          - integer
          - 'null'
          format: uint16
          minimum: 0
          maximum: 65535
          description: iBeacon Minor.
        rssi1m:
          type:
          - array
          - 'null'
          description: List of new Calibrated RSSI@1m values (iBeacon) for each TX power level the Device can use.
          items:
            type: integer
          example:
          - -115
          - -84
          - -81
          - -77
          - -72
          - -69
          - -65
          - -59
    TemperatureProbe:
