              timeSinceTap:
                type: number
                description: Time since tap.
              firmware:
                type: string
                minLength: 1
                description: Firmware version of scanned device.
              model:
                type: number
                description: Scanned device version number.
              txPowerDbm:
                type: number
                description: Transmission Power (in dBm) of a scanned device.
              uniqueId:
                type: string
                minLength: 1
                description: Unique identifier (id) of a scanned device.
              calibratedRssi1m:
                type: number
                description: Calibrated RSSI value at 1 meter from a scanned device.
              calibratedRssi0m:
                type: number
                description: Calibrated RSSI value at 0 meters from a scanned device.
              moving:
                type: boolean
                description: Flag showing whether device is currently in motion.
              eddystoneNamespace:
                type: string
                minLength: 1
                description: Namespace value from Eddystone UID frame.
