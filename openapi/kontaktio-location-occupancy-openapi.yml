              timestamp:
                type: string
                minLength: 1
                description: Timestamp when telemetry was received by Kio Cloud.
              beaconTimestamp:
                type: string
                minLength: 1
                description: Telemetry timestamp from beacon.
              gatewayTimestamp:
                type: string
                minLength: 1
                description: Telemetry timestamp from gateway.
              cloudTimestamp:
                type: string
                minLength: 1
                description: Timestamp when telemetry comes to Kontakt.io cloud.
              accelerometerSensitivity:
                type: number
                description: |-
                  Accelerometer sensitivity.

                  The accelerometer sensitivity represents the scale in which the following numbers are given. A sensitivity of 16 means that the numbers are in 16 mg units, or 0.016g.

                  To decode a triple [0, 1, 64] with sensitivity 16.:

                  X component is just 0

                  Y component is -1 * 16 mg = -0.016g

                  Z component is 64 * 16mg = 1.024g

                  So the raw vector [0, -1, 64] gets multiplied by 0.016g and the resulting vector is: [0, -0.016, 1.024] g.016g.
              accelerometerX:
                type: number
