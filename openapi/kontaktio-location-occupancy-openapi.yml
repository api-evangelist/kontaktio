      title: Streams Occupancy Data Model
      examples:
        - type: OCCUPANCY
          timestamp: '2022-05-02T10:31:02.422Z'
          occupancyType: room
          occupancySource: sensor
          companyId: string
          occupancy: 15
          locationId: string
      properties:
        type:
          type: string
          description: Identifies the origin of the data stream message.
          example: OCCUPANCY
        timestamp:
          type: string
          description: 'Date/time of the occupancy event calculation. ISO 8601 UTC format (yyyy-mm-ddThh:mm:sssz).'
          example: '2022-05-02T10:31:02.422Z'
        occupancyType:
          type: string
          description: |-
            Identifies the occupancy source (type). <br> <br>The type is one of:
            * room - room occupancy
            * room_attribute - seat occupancy
            * space - footfall space occupancy
            * zone - Smart Location space occupancy
          enum:
            - room
            - room_attribute
            - space
            - zone
          example: room
        occupancySource:
          type: string
          description: |
            Identifies the occupancy event source. <br> <br> The source is one of:
            * sensor - event from an occupancy sensor
            * location - event from a device location
            * reset - event from an occupancy value reset
          enum:
            - sensor
            - location
            - reset
          example: sensor
        companyId:
          type: string
          description: Id of the Kio Cloud account.
        occupancy:
          type: integer
          example: 15
          description: Total occupancy count; dependent on the OccupancyType.
        locationId:
          type: string
          description: |-
            Represents the unique location identifier. Value is dependent on the occupancyType event source and should be interpreted differently. <br> <br> The Id is one of:
            * room - roomId
            * room_attribute - roomAttributeId
            * space - spaceId (footfall space)
            * zone - zoneId (Smart Location Space)
