      operationId: get-v3-occupancy-spaces
      description: |-
        Returns the current occupancy of all footfall spaces or for a specific footfall space(s) with use of the spaceId query parameter.

        Occupancy is the count of people present in a footfall space. 

        A footfall space is a user-defined virtual location that identifies where a Traffic Portal Beam measures the inbound (entering) and outbound (exiting) people traffic. The Portal Beam uses an invisible threshold line to detect people entering and exiting at its installation location.

        The occupancy count of a footfall space is reset every day at midnight. This means that the count starts from zero at the beginning of each day, and only includes the traffic recorded during that day.
