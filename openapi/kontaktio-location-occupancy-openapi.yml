openapi: 3.1.0
info:
  title: Location & Occupancy
  version: '1.0'
  description: 'Real-time and historical Kio Cloud apps data including location tracking, occupancy, and telemetry.'
  contact:
    name: Kontakt.io Support
    url: 'https://support.kontakt.io'
    email: support@kontakt.io
  termsOfService: 'https://kontakt.io/terms-of-service'
  summary: 'Real-time and historical Kio Cloud apps data including location tracking, occupancy, and telemetry.'
servers:
  - url: 'https://apps.cloud.us.kontakt.io'
    description: 'Kio Cloud US '
  - url: 'https://apps.cloud.uk.kontakt.io'
    description: Kio Cloud UK
paths:
  /v2/locations/campuses:
    get:
      summary: List all campuses
      operationId: get-locations-campuses
      description: |
        Returns a list of all campuses. Resource supports pagination through request parameters.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - schema:
            type: integer
          in: query
          name: id
          description: Filter by campus ID
        - schema:
            type: string
          in: query
          name: name
          description: Filter by name
        - schema:
            type: string
          in: query
          name: description
          description: Filter by description
        - schema:
            type: string
          in: query
          name: buildingName
          description: Filter by the building name
        - $ref: '#/components/parameters/floorName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campus-List'
              examples:
                All campuses:
                  value:
                    links:
                      - rel: self
                        href: 'http://apps.cloud.us.kontakt.io/v2/locations/campuses?page=0&size=20'
                    content:
                      - id: 93915
                        name: K.io_Lab_fixed
                        address: '3, Stoczniowców, Podgórze, Krakow, 30-709, Poland'
                        description: Krakow Lab
                        lat: 50.0500646
                        lng: 19.9816184
                        buildings:
                          - id: 94194
                            name: Lab
                            address: '3, Stoczniowców, Podgórze, Krakow, 30-709, Poland'
                            description: Krakow Lab
                            floors:
                              - id: 94215
                                name: Lab_floor_prod1
                                height: 17.8
                                width: 14.6
                                properties:
                                  gridWidth: 4
                                  gridBounds:
                                    boundsLat:
                                      north: 22.2
                                      south: -4.3
                                    boundsLng:
                                      east: 23
                                      west: -8.4
                                  gridDensity: 1
                                  outlineCreated: true
                                level: 0
                                xyGeojson:
                                  type: Feature
                                  geometry:
                                    type: Polygon
                                    coordinates:
                                      - - - 0
                                          - 17.8
                                        - - 14.6
                                          - 17.8
                                        - - 14.6
                                          - 0
                                        - - 0
                                          - 0
                                        - - 0
                                          - 17.8
                                  properties: {}
                                imageXyGeojson:
                                  type: Feature
                                  geometry:
                                    type: Polygon
                                    coordinates:
                                      - - - -0.4
                                          - 18.2
                                        - - 14.9
                                          - 18.2
                                        - - 14.9
                                          - -0.3
                                        - - -0.4
                                          - -0.3
                                        - - -0.4
                                          - 18.2
                            lat: 50.050278
                            lng: 19.9820425
                    page:
                      size: 20
                      totalElements: 1
                      totalPages: 1
                      number: 0
      tags:
        - Campuses
      security:
        - api_key: []
    parameters: []
  '/v2/locations/campuses/{id}':
    get:
      summary: Retrieve a campus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campus'
              examples: {}
          headers: {}
      operationId: get-locations-campuses
      description: |
        Retrieves the details of a single campus by its ID. 

        Supply the unique Campus ID and its corresponding information returned includes the campus buildings, building floors, and each floor's gateway and sensor devices.
      parameters: []
      x-internal: false
      tags:
        - Campuses
      security:
        - api_key: []
    parameters:
      - schema:
          type: string
          example: '93915'
        name: id
        in: path
        required: true
        description: ID of the campus.
  /v2/locations/buildings:
    get:
      summary: List all buildings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
              examples:
                All Buildings:
                  value:
                    links:
                      - rel: self
                        href: 'http://apps.cloud.us.kontakt.io/v2/locations?page=0&size=20'
                    content:
                      - id: 94194
                        name: Lab
                        address: '3, Stoczniowców, Podgórze, Krakow, 30-709, Poland'
                        description: Krakow Lab
                        floors:
                          - id: 94215
                            name: Lab_floor_prod1
                            height: 17.8
                            width: 14.6
                            properties:
                              gridWidth: 4
                              gridBounds:
                                boundsLat:
                                  north: 22.2
                                  south: -4.3
                                boundsLng:
                                  east: 23
                                  west: -8.4
                              gridDensity: 1
                              outlineCreated: true
                            level: 0
                            xyGeojson:
                              type: Feature
                              geometry:
                                type: Polygon
                                coordinates:
                                  - - - 0
                                      - 17.8
                                    - - 14.6
                                      - 17.8
                                    - - 14.6
                                      - 0
                                    - - 0
                                      - 0
                                    - - 0
                                      - 17.8
                              properties: {}
                            imageXyGeojson:
                              type: Feature
                              geometry:
                                type: Polygon
                                coordinates:
                                  - - - -0.4
                                      - 18.2
                                    - - 14.9
                                      - 18.2
                                    - - 14.9
                                      - -0.3
                                    - - -0.4
                                      - -0.3
                                    - - -0.4
                                      - 18.2
                        campus:
                          id: 93915
                          name: K.io_Lab_fixed
                        lat: 50.050278
                        lng: 19.9820425
                    page:
                      size: 20
                      totalElements: 1
                      totalPages: 1
                      number: 0
      operationId: get-locations-buildings
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/floorName'
        - schema:
            type: string
          in: query
          name: buildingId
          description: Filter by building IDs
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/description'
      description: |-
        Returns a list of all buildings. 
        Resource supports pagination through request parameters.
      tags:
        - Buildings
      security:
        - api_key: []
    parameters: []
  '/v2/locations/buildings/{id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: ID of the building.
    get:
      summary: Retrieve a building
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
              examples: {}
      operationId: get-v2-locations-buildings-id
      description: Retrieve a single building by ID.
      parameters: []
      tags:
        - Buildings
      security:
        - api_key: []
  /v2/locations/rooms:
    get:
      summary: List all rooms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rooms'
      operationId: get-locations-rooms
      description: Returns a list of rooms. Resource supports pagination through request parameters.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/name'
        - schema:
            type: string
          in: query
          name: campusName
          description: Filter by the campus name or one of multiple names
        - schema:
            type: string
          in: query
          description: Filter by room id or one of multiple roomIds
          name: id
        - schema:
            type: string
          in: query
          name: buildingName
          description: Filter by the building name or one of multiple names
      x-extension-2: null
      tags:
        - Rooms
      security:
        - api_key: []
    parameters: []
  /v2/locations/floors:
    get:
      summary: List all floors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Floors'
      operationId: get-locations-floors
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - schema:
            type: string
          in: query
          name: id
          description: Filter by one or more floor IDs
        - schema:
            type: string
          in: query
          name: name
          description: Filter by one or more floor names
        - schema:
            type: string
          in: query
          name: locationId
          description: Filter by one or more floor location IDs
        - schema:
            type: string
          in: query
          name: locationName
          description: Filter by one or more floor names
        - schema:
            type: string
          in: query
          name: exceptId
          description: Filter out one or more floor IDs
        - schema:
            type: string
          in: query
          name: sourceId
          description: Filter by one or more sourceIds of attached gateways
      description: Retrieve a floor list. Resource supports pagination through request parameters.
      tags:
        - Floors
      security:
        - api_key: []
    parameters: []
  '/v3/locations/images/{type}/{id}':
    get:
      summary: Retrieve location image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    topologyType:
                      type: string
                    id:
                      type: integer
                    presignedUrl:
                      type: string
                x-examples:
                  example-1:
                    - topologyType: CAMPUS
                      id: 27857
                      presignedUrl: 'http://localhost/images/campus/test1234test/27857'
                    - topologyType: CAMPUS
                      id: 27858
                      presignedUrl: 'http://localhost/images/campus/test1234test/27858'
              examples:
                example-1:
                  value:
                    - topologyType: CAMPUS
                      id: 27857
                      presignedUrl: 'http://localhost/images/campus/test1234test/27857'
                    - topologyType: CAMPUS
                      id: 27858
                      presignedUrl: 'http://localhost/images/campus/test1234test/27858'
      operationId: get-v3-locations-images
      description: |-
        Returns a target URL to download the images of the ids requested by topology type (Smart Location campus, building, floor). Floor type results in the floor plan image.

        URL is valid for 24 hours.

        Whenever possible, request multiple ids to limit the number of calls and decrease your latency.
      security:
        - api_key: []
      parameters: []
      tags:
        - Location Images
    parameters:
      - schema:
          type: string
          enum:
            - CAMPUS
            - BUILDING
            - FLOOR
        name: type
        in: path
        description: Type of topology item.
        required: true
      - schema:
          type: integer
          example: '177214, 187564'
        name: id
        in: path
        required: true
        description: Comma-separated list of each topology identifier (id).
