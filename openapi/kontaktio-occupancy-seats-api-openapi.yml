                      occupancy: 0
                    - roomId: 126956
                      roomName: Workstations
                      floorId: 94215
                      floorName: Lab_floor_prod1
                      buildingId: 94194
                      buildingName: Lab
                      campusId: 93915
                      campusName: K.io_Lab_fixed
                      attributeId: d1411a86-9bf6-4eb1-8528-4e289faa5274
                      attributeName: '2'
                      lastUpdate: '2021-11-28T16:30:49.133Z'
