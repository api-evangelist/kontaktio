                      occupancy: 0
                    page:
                      size: 20
                      totalElements: 4
                      totalPages: 1
                      number: 0
      operationId: get-v3-occupancy-room-attributes
      description: 'Returns the current seat occupany for all Rooms or the current seat occupancy for a room(s) with the roomId query parameter.


        By default **valueType** parameter is set to **binary**: occupancy returned is either 0 (not occupied) or 1 (occupied). '
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - in: query
        name: roomId
        schema:
          type: number
          example: 127326
        description: Filter by one or more Room IDs (separated by comma)
      - $ref: '#/components/parameters/valueType'
      tags:
      - 'Occupancy: Seats'
      security:
      - api_key: []
  /v3/occupancy/room-attributes/history:
    parameters: []
    get:
      summary: Retrieve seat occupancy history by room
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occupancy-Room-Attributes-History'
              examples: {}
        '429':
          $ref: '#/components/responses/error-429'
      operationId: get-v3-occupancy-room-attributes-history
      description: 'Returns the seat occupancy history for a room.


        By default **valueType** parameter is set to **binary**: occupancy returned is either 0 (not occupied) or 1 (occupied).'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - in: query
        name: roomId
        schema:
          type: number
          example: 126956
        description: Filter by one or more Room IDs (separated by comma)
        required: true
      - $ref: '#/components/parameters/valueType'
      tags:
      - 'Occupancy: Seats'
      security:
      - api_key: []
components:
  parameters:
    startTime:
      name: startTime
      in: query
      schema:
        type: string
        example: '2020-11-27T08:00:00.000000Z'
        format: date-time
      description: 'Filter by start time. <br> Values are always expressed in UTC (equivalent to an offset of +00:00). <br> The timezone designator is always Z. <br> The hours component must be specified as two digits in 24-hour format. '
    size:
      name: size
      in: query
      schema:
        type: string
        default: '20'
      description: Size of the page to retrieve.
    sort:
      name: sort
      in: query
      schema:
        type: string
        default: asc
        example: ?sort=firstname&sort=lastname,asc
        enum:
        - asc
        - desc
      description: 'Sort objects returned in the response. Format property,property '
    page:
      name: page
      in: query
      schema:
        type: integer
        default: '0'
      description: Page you want to retrieve; 0 indexed.
    valueType:
      name: valueType
      in: query
      required: false
      schema:
        type: string
        enum:
        - binary
        - numerical
        default: binary
      description: Type of occupancy value returned, default is 'binary'. If valueType is 'binary', then occupancy is either 0 (not occupied) or 1 (occupied). If value is 'numerical', occupancy value is the count of people detected.
    endTime:
      name: endTime
      in: query
      schema:
        type: string
        example: ' 2020-11-29T08:00:00.000000Z'
        format: date-time
      description: 'Filter by end time. <br> Values are always expressed in UTC (equivalent to an offset of +00:00). <br> The timezone designator is always Z. <br> The hours component must be specified as two digits in 24-hour format. '
  schemas:
